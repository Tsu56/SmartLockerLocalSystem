services:
  display-service:
    # ระบุตำแหน่งโฟลเดอร์ที่มี Dockerfile อยู่
    build: 
      context: ./display_service
      dockerfile: Dockerfile
    container_name: display_service
    ports:
      - "5000:8000"
    volumes:
      # เชื่อมโค้ดจากโฟลเดอร์ย่อยเข้ากับ Container
      - ./display_service:/display_service
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: always
    networks:
      - smart-locker-network

  device-identity-service:
    # ระบุตำแหน่งโฟลเดอร์ที่มี Dockerfile อยู่
    build: 
      context: ./device_identity_service
      dockerfile: Dockerfile
    container_name: device_identity_service
    ports:
      - "5001:8000"
    volumes:
      # เชื่อมโค้ดจากโฟลเดอร์ย่อยเข้ากับ Container
      - ./device_identity_service:/device_identity_service
      # เชื่อมฐานข้อมูลให้อยู่ในโฟลเดอร์ database ของ Service นั้นๆ
      - ./device_identity_service/database:/device_identity_service/database
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SERVER_URL=${SERVER_URL}
    restart: always
    networks:
      - smart-locker-network

  local-auth-service:
    # ระบุตำแหน่งโฟลเดอร์ที่มี Dockerfile อยู่
    build: 
      context: ./local_auth_service
      dockerfile: Dockerfile
    container_name: local_auth_service
    ports:
      - "5002:8000"
    volumes:
      # เชื่อมโค้ดจากโฟลเดอร์ย่อยเข้ากับ Container
      - ./local_auth_service:/local_auth_service
      # เชื่อมฐานข้อมูลให้อยู่ในโฟลเดอร์ database ของ Service นั้นๆ
      - ./local_auth_service/database:/local_auth_service/database
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: always
    networks:
      - smart-locker-network

  # ตัวอย่าง: หากในอนาคตคุณเพิ่ม Service อื่นๆ
  # locker-controller:
  #   build: ./locker_controller_service
  #   ... (ตั้งค่าอื่นๆ) ...

networks:
  smart-locker-network:
    driver: bridge